<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Slider</title>
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  />
      <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="slider-container">
       
           <div class="slide active" style="background-image: url('https://images.unsplash.com/photo-1483728642387-6c3bdd6c93e5?q=80&w=1476&auto=format&fit=crop');"
></div>
        
<div class="slide " style="background-image: url('https://images.unsplash.com/photo-1682784106024-abd726acba13?w=1600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8ZmlyZXxlbnwwfHwwfHx8MA%3D%3D');"
></div>

<div class="slide " style="background-image: url('https://images.unsplash.com/photo-1527066236128-2ff79f7b9705?w=1600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8d2F0ZXJ8ZW58MHx8MHx8fDA%3D');"
></div>

<div class="slide " style="background-image: url('https://images.unsplash.com/photo-1519806390608-acf7ef9c8d1b?w=1600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8N3x8ZGlydHxlbnwwfHwwfHx8MA%3D%3D');"
></div>
<button class="arrow left-arrow" id="left">
    <i class="fas fa-arrow-left"></i>
</button>
<button class="arrow right-arrow" id="right">
    <i class="fas fa-arrow-right"></i>
</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
