<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  />
      <link rel="stylesheet" href="style.css">
    <title>Double Vertical Slider</title>
</head>
<body>

    <div class="slider-container">
        <div class="left-slide">
            <div style="background-color:#fd3555">
                <h1>Nature Flower</h1>
                <p>all in pink</p>
            </div>
            <div style="background-color:#2a86ba">
                <h1>Bluue Sky</h1>
                <p>with its mountains </p>
            </div>
            <div style="background-color:#252e33">
                <h1>Lonely Castle</h1>
                <p>in the wilderness</p>
            </div>
            <div style="background-color:#ffb866">
                <h1>Flying eagle</h1>
                <p>in the sunset</p>
            </div>
        </div>
        <div class="right-slide">
           <div style ="background-image:url('https://images.unsplash.com/photo-1517362087576-65980c8a9e71?w=1600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTZ8fGZseWluZyUyMGVhZ2xlfGVufDB8fDB8fHww')"></div>
           <div style ="background-image:url('https://images.unsplash.com/photo-1610610516700-9af1338c7b56?w=1600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTZ8fGxvbmVseSUyMGNhc3RsZXxlbnwwfHwwfHx8MA%3D%3D')"></div>
            <div style ="background-image:url('https://plus.unsplash.com/premium_photo-1739037172419-98ead2ee574f?w=1600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NXx8Ymx1ZSUyMHNreSUyMHdpdGglMjBtb3VudGFpbnN8ZW58MHx8MHx8fDA%3D')"></div>
            <div style="background-image:url('https://plus.unsplash.com/premium_photo-1685030411267-c9bffe9b8c50?w=1600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTN8fG5hdHVyZSUyMGZsb3dlciUyMHBpbmt8ZW58MHx8MHx8fDA%3D')"></div>
        </div>
        <div class="action-buttons">
            <button class="down-button">
                <i class="fas fa-arrow-down"></i>
            </button>
            <button class="up-button">
                <i class="fas fa-arrow-up"></i>
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
